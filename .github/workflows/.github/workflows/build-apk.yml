name: Build Huroofi Al Jameela APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract app project
        run: | rm -rf app_project mkdir app_project unzip -q HuroofiAlJameela_v2_project.zip -d app_project 
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: app_project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huroofi-AlJameela-APK
          path: app_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
